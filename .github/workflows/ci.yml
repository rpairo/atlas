name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of it on the tagged commit before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Property tests on 1,000 random boards
        if: matrix.node == 26
        run: node --test test/random.test.mjs
        env:
          RUNS: "1000"

  dist:
    name: dist is built from src
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm run build
      - name: The committed dist matches a fresh build
        run: git diff --exit-code -- dist

  types:
    name: type declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Type-check the usage file against types/atlas.d.ts
        run: npx --yes -p typescript@7.0.2 tsc -p test/types

  audit:
    # Chrome and Edge, the browsers Atlas is tuned for, run every check (the runner image has both).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser audit
            browser: google-chrome
          - name: browser audit (Edge)
            browser: microsoft-edge
    env:
      CHROME: ${{ matrix.browser }}
      # The runner's kernel does not allow Chrome's sandbox; the pages are this repository's own,
      # served on localhost.
      CHROME_FLAGS: --no-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The browser
        run: $CHROME --version
      - name: Example boards, from wide to stacked
        run: |
          for board in incident-response dependencies state-machine org-chart; do
            scripts/audit.sh ../../examples/$board/board.json 1400 900 500
          done
      - name: Every direction
        run: |
          for direction in left up down; do
            EXTRA="&direction=$direction" scripts/audit.sh "" 1400 600
          done
      - name: A right-to-left page
        run: EXTRA="&rtl=1" scripts/audit.sh "" 1400 500
      - name: Short windows, where the detail is a sheet at the foot of the screen (and a short board, where it fits below)
        run: |
          HEIGHT=800 scripts/audit.sh "" 1100 500
          HEIGHT=700 scripts/audit.sh "" 1000
          HEIGHT=430 scripts/audit.sh "" 932
          HEIGHT=800 scripts/audit.sh ../../examples/state-machine/board.json 1100
      - name: The built file, themed from a page with its own variables
        run: EXTRA="&dist=1&hostvars=1" scripts/audit.sh "" 1400 900 500
      - name: The dark theme
        run: EXTRA="&theme=dark" scripts/audit.sh "" 1400 500
      - name: Nested and titled groups, across and along the flow
        run: |
          scripts/audit.sh ../fixtures/groups.json 1400 900 500
          for direction in left down; do
            EXTRA="&direction=$direction" scripts/audit.sh ../fixtures/groups.json 1400
          done

  edge-windows:
    # Edge on Windows: its fonts and scroll bars, and forced colours (Windows contrast themes), emulated.
    name: browser audit (Edge, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Playwright, driving the Edge of the runner image (not a dependency of Atlas)
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: The audit in Edge
        run: node scripts/audit-browsers.mjs msedge

  other-browsers:
    name: browser audit (Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Playwright with Firefox and WebKit (for this job only; not a dependency of Atlas)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps firefox webkit
      - name: The same audit in Firefox and WebKit
        run: node scripts/audit-browsers.mjs firefox webkit
