<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas viewer</title>
<style>
  /* Development viewer: loads the sources (not the build), any board under examples/.
     ?board=<path relative to this page>  ?direction=right|down|left|up  ?theme=light|dark */
  :root { color-scheme: light; --bg: #f1f4f7; --fg: #132033; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0c141e; --fg: #e3eaf2; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0c141e; --fg: #e3eaf2; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1320px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px); }
  h1 { font-size: 2rem; margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Atlas</h1>
  <div id="host"></div>
</main>
<script type="module">
  import { Atlas } from "../src/index.js";
  const q = new URLSearchParams(location.search);
  const board = q.get("board") ?? "incident-response/board.json";
  const theme = q.get("theme");
  if (theme === "light" || theme === "dark") {
    document.documentElement.dataset.theme = theme;
    document.getElementById("host").setAttribute("theme", theme);
  }
  const doc = await (await fetch(board)).json();
  const direction = q.get("direction");
  if (direction) doc.meta = { ...doc.meta, direction };
  document.getElementById("title").textContent = doc.meta?.title ?? "Atlas";
  window.atlas = new Atlas(document.getElementById("host"), { document: doc });
</script>
</body>
</html>
