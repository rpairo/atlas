<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body { margin: 0; font: 15px/1.5 system-ui, sans-serif; } main { padding: 24px; }</style></head>
<body><main><div id="host"></div></main>
<script type="module">
// Audit: selects every node and checks the wires against the invariants, then runs edits.
const { Atlas } = await import(new URLSearchParams(location.search).get("dist") ? "../../dist/atlas.js" : "../../src/index.js");
const q = new URLSearchParams(location.search);
const board = q.get("board") ?? "../../examples/incident-response/board.json";
const loops = [];
window.addEventListener("error", e => { if (String(e.message).includes("ResizeObserver")) loops.push(e.message); });
const out = (r) => { const pre = document.createElement("pre"); pre.id = "audit"; pre.textContent = JSON.stringify(r); document.body.append(pre); };
try {
  document.body.dataset.stage = "fetch";
  let text = await (await fetch(board)).text();
  if (q.get("direction")) { const d = JSON.parse(text); d.meta = { ...(d.meta ?? {}), direction: q.get("direction") }; text = JSON.stringify(d); }
  document.body.dataset.stage = "fetched";
  const host = document.getElementById("host");
  // rtl=1: a right-to-left page; the board's geometry must not mirror under the wires.
  if (q.get("rtl")) document.documentElement.dir = "rtl";
  // hostvars=1: a page with its own --paper/--sheet/--ink/--rule on :root that themes Atlas with
  // them from the host element (the case that once made a cycle and left the board unpainted).
  // A page with its own light colours says so with theme="light": the colours it does not set keep
  // Atlas's light defaults even when the system is dark.
  if (q.get("hostvars")) {
    document.documentElement.setAttribute("style", "--paper:#fbf7ef;--sheet:#fffdf8;--ink:#201a10;--rule:#d9cdb8");
    host.setAttribute("style", "--atlas-paper:var(--paper);--atlas-sheet:var(--sheet);--atlas-ink:var(--ink);--atlas-rule:var(--rule)");
    host.setAttribute("theme", "light");
  }
  // theme=dark or theme=light: a forced theme, whatever the system's.
  if (q.get("theme")) host.setAttribute("theme", q.get("theme"));
  const map = new Atlas(host, { document: text, animate: false });
  document.body.dataset.stage = "constructed";
  // Headless Chrome stops producing frames when nothing changes; wait with a timer instead.
  await new Promise(r => setTimeout(r, 100));
  document.body.dataset.stage = "framed";
  const res = { width: innerWidth, mode: null, nodes: 0, wires: 0, missing: [], underNode: [], crossings: [], close: [], shortTip: [], outside: [], moved: [], unpainted: [], loops, edits: [] };
  const wrap = map.root.querySelector(".atlas");
  res.mode = wrap.dataset.mode;
  const boardEl = map.root.querySelector(".board");
  // The theme reaches the board: paper, sheets and rules are painted, not transparent.
  const clear = c => c === "transparent" || /rgba\(.*,\s*0\)$/.test(c);
  const node0 = map.root.querySelector(".node");
  for (const [what, value] of [["board background", getComputedStyle(boardEl).backgroundColor], ["board border", getComputedStyle(boardEl).borderTopColor], ["node background", node0 && getComputedStyle(node0).backgroundColor], ["node border", node0 && getComputedStyle(node0).borderTopColor]]) {
    if (value && clear(value)) res.unpainted.push(`${what}: ${value}`);
  }
  const rects = () => { const B = boardEl.getBoundingClientRect(); return new Map([...map._els].map(([id, b]) => { const r = b.getBoundingClientRect(); return [id, { l: r.left - B.left, r: r.right - B.left, t: r.top - B.top, b: r.bottom - B.top }]; })); };
  const model = map.toJSON();
  const ids = model.nodes.map(n => n.id);
  // Stacked: one column of lanes, nodes at a readable width, nothing on top of anything, the
  // detail under the selected node.
  res.stack = [];
  const stackCheck = id => {
    if (res.stack.length > 12) return;
    const B = boardEl.getBoundingClientRect();
    const boxes = [...map._els].map(([nid, b]) => [nid, b.getBoundingClientRect()]);
    const panel = map.root.querySelector(".panel");
    if (panel && !panel.hidden) boxes.push(["(panel)", panel.getBoundingClientRect()]);
    for (const [nid, r] of boxes) {
      if (r.left < B.left - 1 || r.right > B.right + 1) res.stack.push(`${id}: ${nid} outside the board`);
      if (r.width < (B.width - 40) * 0.4) res.stack.push(`${id}: ${nid} too narrow (${Math.round(r.width)} of ${Math.round(B.width)})`);
      if (nid !== "(panel)" && r.height > 200) res.stack.push(`${id}: ${nid} stretched to ${Math.round(r.height)}px`);
    }
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const [a, ra] = boxes[i], [b, rb] = boxes[j];
      if (Math.min(ra.right, rb.right) - Math.max(ra.left, rb.left) > 2 && Math.min(ra.bottom, rb.bottom) - Math.max(ra.top, rb.top) > 2) res.stack.push(`${id}: ${a} over ${b}`);
    }
    const sel = map._els.get(id)?.getBoundingClientRect(), pr = panel?.getBoundingClientRect();
    if (sel && pr && !panel.hidden && pr.top < sel.bottom - 1) res.stack.push(`${id}: the detail is not under the node`);
  };
  const base = rects();
  for (const id of ids) {
    const t0 = performance.now();
    map.select(id, { focus: false, animate: false });
    const ms = performance.now() - t0;
    if (!res.slowest || ms > res.slowest.ms) res.slowest = { id, ms: Math.round(ms * 10) / 10 };
    res.nodes++;
    const now = rects();
    if (res.mode !== "flow") { stackCheck(id); continue; } // stacked: the detail opens under the node and pushes the rest
    for (const [nid, r] of now) { const b = base.get(nid); if (Math.abs(r.l - b.l) > 0.5 || Math.abs(r.t - b.t) > 0.5) { res.moved.push(`${id}: ${nid}`); break; } }
    const pairs = new Set(model.edges.filter(e => e.from !== e.to && (e.from === id || e.to === id)).map(e => e.from + ">" + e.to));
    const ws = map._wires;
    res.wires += ws.length;
    if (ws.length !== pairs.size) res.missing.push(`${id}: ${ws.length}/${pairs.size}`);
    const B = boardEl.getBoundingClientRect();
    ws.forEach(w => {
      const p = w.screen;
      for (let i = 1; i < p.length; i++) {
        const a = p[i - 1], b = p[i], L = Math.hypot(b.x - a.x, b.y - a.y);
        for (let s = 0; s <= L; s += 3) {
          const x = a.x + (b.x - a.x) * s / L, y = a.y + (b.y - a.y) * s / L;
          if (x < -1 || y < -1 || x > B.width + 1 || y > B.height + 1) { res.outside.push(`${id}: ${w.from}>${w.to}`); break; }
          for (const [nid, r] of now) if (x > r.l + 2 && x < r.r - 2 && y > r.t + 2 && y < r.b - 2) { res.underNode.push(`${id}: ${w.from}>${w.to} over ${nid}`); break; }
        }
      }
      const n = p.length, tip = p[n - 1], prev = p[n - 2];
      const last = Math.hypot(tip.x - prev.x, tip.y - prev.y);
      if (last < 14) res.shortTip.push(`${id}: ${w.from}>${w.to} (${last.toFixed(1)})`);
    });
    const segs = ws.map(w => w.screen.slice(0, -1).map((p, k) => [p, w.screen[k + 1]]));
    for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
      if (ws[i].h === ws[j].h) continue;
      let c = 0, close = 0;
      for (const [p, q2] of segs[i]) for (const [r, s] of segs[j]) {
        const hA = Math.abs(p.y - q2.y) < .5, hB = Math.abs(r.y - s.y) < .5;
        if (hA !== hB) {
          const [h1, h2, v1, v2] = hA ? [p, q2, r, s] : [r, s, p, q2];
          if (v1.x > Math.min(h1.x, h2.x) + .5 && v1.x < Math.max(h1.x, h2.x) - .5 && h1.y > Math.min(v1.y, v2.y) + .5 && h1.y < Math.max(v1.y, v2.y) - .5) c++;
        } else {
          const d = hA ? Math.abs(p.y - r.y) : Math.abs(p.x - r.x);
          const [a1, a2, b1, b2] = hA ? [p.x, q2.x, r.x, s.x] : [p.y, q2.y, r.y, s.y];
          if (d < 5 && Math.min(Math.max(a1, a2), Math.max(b1, b2)) - Math.max(Math.min(a1, a2), Math.min(b1, b2)) > 2) close++;
        }
      }
      if (c) res.crossings.push(`${id}: ${ws[i].from}>${ws[i].to} x ${ws[j].from}>${ws[j].to}`);
      if (close) res.close.push(`${id}: ${ws[i].from}>${ws[i].to} || ${ws[j].from}>${ws[j].to}`);
    }
  }
  // A sheet at the foot of the window overlaps the board: open, it must cover the board, not show
  // through it. Pull it up over the board and look at what is on top. Below the board in the page,
  // the detail never overlaps it.
  res.covered = [];
  if (wrap.dataset.panel === "sheet") {
    map.select(ids[0], { focus: false, animate: false, open: true });
    const panel = map.root.querySelector(".panel");
    panel.style.marginTop = "-160px";
    const r = panel.getBoundingClientRect();
    for (const [x, y] of [[r.left + 40, r.top + 20], [r.left + r.width / 2, r.top + 60], [r.right - 40, r.top + 100]]) {
      const hit = map.root.elementFromPoint(x, y);
      if (hit && !panel.contains(hit)) res.covered.push(`${Math.round(x)},${Math.round(y)}: ${hit.className?.baseVal ?? hit.className}`);
    }
    panel.style.marginTop = "";
    map.openDetail(false);
  }
  if (wrap.dataset.panel === "below") {
    map.select(ids[0], { focus: false, animate: false });
    const panel = map.root.querySelector(".panel");
    if (getComputedStyle(panel).position !== "static") res.covered.push(`below the board the detail is ${getComputedStyle(panel).position}`);
    if (panel.getBoundingClientRect().top < boardEl.getBoundingClientRect().bottom - 1) res.covered.push("below the board the detail overlaps it");
  }
  // Groups: a group never pushes its lane's nodes into a second column (or row), each box holds
  // every member of its span and sits inside its parent's box, and a legend is on nothing (no node,
  // no lane title, no other legend).
  res.groups = [];
  if (res.mode === "flow" && model.groups?.length) {
    map.select(null, { focus: false, animate: false });
    const R = e => e.getBoundingClientRect();
    const hit = (a, b) => Math.min(a.right, b.right) - Math.max(a.left, b.left) > 0.5 && Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > 0.5;
    const inside = (a, b) => a.left >= b.left - 0.5 && a.right <= b.right + 0.5 && a.top >= b.top - 0.5 && a.bottom <= b.bottom + 0.5;
    const vertical = ["down", "up"].includes(map._layout.direction);
    const parent = new Map(model.groups.map(g => [g.id, g.parent]));
    const within = (g, target) => { for (let k = 0; g != null && k < 20; k++, g = parent.get(g)) if (g === target) return true; return false; };
    for (const lane of map.root.querySelectorAll(".flow > .lane")) {
      const cross = new Set([...lane.querySelectorAll("ol.nodes > li > .node")].map(b => Math.round(vertical ? R(b).top : R(b).left)));
      if (cross.size > 1) res.groups.push(`lane ${lane.dataset.lane}: nodes in ${cross.size} ${vertical ? "rows" : "columns"}`);
      for (const box of lane.querySelectorAll(".group-box")) {
        const g = box.dataset.group;
        for (const n of model.nodes) {
          if (map._layout.laneOf.get(n.id) !== lane.dataset.lane || !within(n.group, g)) continue;
          if (!inside(R(map._els.get(n.id)), R(box))) res.groups.push(`lane ${lane.dataset.lane}: ${n.id} outside the box of ${g}`);
        }
        const up = parent.get(g) != null && lane.querySelector(`.group-box[data-group="${CSS.escape(parent.get(g))}"]`);
        if (up && !inside(R(box), R(up))) res.groups.push(`lane ${lane.dataset.lane}: the box of ${g} is not inside its parent's`);
      }
    }
    const legends = [...map.root.querySelectorAll(".group-legend > span, .group-box > span")];   // (0.3 put the legend inside the box)
    const name = e => `"${e.textContent.slice(0, 24)}"`;
    legends.forEach((g, i) => {
      for (const [nid, b] of map._els) if (hit(R(g), R(b))) res.groups.push(`legend ${name(g)} on node ${nid}`);
      for (const t of map.root.querySelectorAll(".lane-title")) if (t.textContent && hit(R(g), R(t))) res.groups.push(`legend ${name(g)} on lane title ${name(t)}`);
      for (const o of legends.slice(i + 1)) if (hit(R(g), R(o))) res.groups.push(`legend ${name(g)} on legend ${name(o)}`);
    });
  }
  document.body.dataset.stage = "selected-all";
  // Edits: add, connect, undo restores the exact document, rename keeps geometry.
  const before = JSON.stringify(map.toJSON());
  const lane = map._layout.mode === "auto" ? undefined : (map._layout.flow[1]?.id ?? map._layout.flow[0]?.id);
  const anchor = ids.find(x => map._layout.laneOf.get(x) === map._layout.flow[0]?.id);
  map.addNode({ id: "audit_new", title: "Audit node", lane }, { edges: anchor ? [{ from: anchor, to: "audit_new" }] : [] });
  res.edits.push(map._els.has("audit_new") ? "add: ok" : "add: missing");
  map.undo();
  res.edits.push(JSON.stringify(map.toJSON()) === before ? "undo: exact" : "undo: DIFFERENT");
  map.redo(); map.undo();
  map.select(null, { focus: false });
  map.settle(); // headless Chrome does not advance animations without frames
  const r0 = rects();
  const victim = ids[0];
  document.body.dataset.stage = "before-rename";
  map.renameNode(victim, "audit_renamed");
  document.body.dataset.stage = "renamed";
  map.settle();
  const r1 = rects();
  const same = [...r0].every(([k, v]) => { const w = r1.get(k === victim ? "audit_renamed" : k); return w && Math.abs(w.l - v.l) < .5 && Math.abs(w.t - v.t) < .5; });
  if (same) res.edits.push("rename: same geometry");
  else {
    const moved = [...r0].map(([k, v]) => { const w = r1.get(k === victim ? "audit_renamed" : k); return w ? `${k}:${(w.l - v.l).toFixed(0)},${(w.t - v.t).toFixed(0)}` : `${k}:gone`; }).filter(s => !s.endsWith(":0,0") && !s.endsWith(":-0,0") && !s.endsWith(":0,-0"));
    res.edits.push("rename: MOVED " + moved.slice(0, 6).join(" "));
  }
  // Behaviour: a refused edit leaves the map usable, undo brings the warnings back in line, arrow
  // keys move to a node that is on screen in that direction, reorderAll counts what it changes.
  res.behaviour = [];
  const live = ids.map(x => (x === victim ? "audit_renamed" : x));
  const p = live[1] ?? live[0];
  try { map.renameNode(p, "not a valid id"); res.behaviour.push("rename to an invalid id was accepted"); } catch (e) {
    if (e.name !== "AtlasError") res.behaviour.push(`refused rename threw ${e.name}`);
  }
  try {
    // Straight after the refusal, before anything redraws: select, then edit.
    for (const id of live) map.select(id, { focus: false, animate: false });
    map.select(p, { focus: false, animate: false });
    if (map.selected !== p) res.behaviour.push("cannot select after a refused rename");
    map.updateNode(p, { subtitle: "audit" });
    map.undo();
  } catch (e) { res.behaviour.push(`map broken after a refused rename: ${e.message}`); }
  map.connect(p, p);
  const self = map.warnings.some(w => w.code === "self");
  map.select(p, { focus: false, animate: false });
  if (!map._status.textContent.includes(map.labels.selfLoop)) res.behaviour.push(`the summary of a node that feeds itself does not say so (${map._status.textContent})`);
  map.undo();
  if (!self || map.warnings.some(w => w.code === "self")) res.behaviour.push("warnings do not follow undo");
  const centre = id => { const r = map._els.get(id).getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const arrows = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
  for (const id of live) for (const [key, [dx, dy]] of Object.entries(arrows)) {
    const b = map._els.get(id);
    b.focus();
    b.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, composed: true }));
    const to = map._idOf.get(map.root.activeElement);
    if (to === undefined || to === id) continue;
    const [ax, ay] = centre(id), [bx, by] = centre(to);
    if ((bx - ax) * dx + (by - ay) * dy <= 0) res.behaviour.push(`${key} from ${id} went to ${to}, which is not that way`);
  }
  // Assistive technology: the selection is the one current node (not a toggle on every node), the
  // same summary twice is said twice, and find() ignores accents and finds nothing for blank text.
  try {
    map.select(live[0], { focus: false, animate: false });
    const current = [...map._els.values()].filter(b => b.getAttribute("aria-current") === "true");
    if (current.length !== 1 || map._idOf.get(current[0]) !== live[0]) res.behaviour.push(`${current.length} nodes are aria-current`);
    if ([...map._els.values()].some(b => b.hasAttribute("aria-pressed"))) res.behaviour.push("nodes still carry aria-pressed");
    const said = map._status.textContent;
    map.select(live[0], { focus: false, animate: false });
    if (map._status.textContent !== "") res.behaviour.push("the same summary twice was not said again (the live region did not empty)");
    await new Promise(r => setTimeout(r, 200));
    if (map._status.textContent !== said) res.behaviour.push(`after emptying, the live region says "${map._status.textContent}"`);
    if (map.find("").length || map.find("   ").length) res.behaviour.push(`find("") found ${map.find("").length} nodes`);
    const t0 = map.node(live[0]).title ?? live[0];
    const accented = t0.replace(/[aeiou]/i, ch => ({ a: "á", e: "é", i: "í", o: "ó", u: "ú" })[ch.toLowerCase()] ?? ch);
    if (!map.find(accented.toUpperCase()).includes(live[0])) res.behaviour.push(`find("${accented.toUpperCase()}") misses ${live[0]}`);
    map.select(null, { focus: false });
  } catch (e) { res.behaviour.push(`assistive check threw ${e.name}: ${e.message}`); }
  // Marks: a fill and a dot that read in both themes, nothing moves, the rest steps back (but not
  // the selection's neighbours), they follow renames, leave with removed nodes, are cleared by load,
  // and nextMark() walks them in reading order without selecting, saying where it is.
  try {
    const rgb = c => (c.match(/[\d.]+/g) ?? []).slice(0, 3).map(Number);
    const lum = c => { const [r, g, b] = rgb(c).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
    const before = rects();
    const heard = [];
    const onMark = e => heard.push(e.detail);
    map.addEventListener("mark", onMark);
    const some = live.filter((_, i) => i % 5 === 1).slice(0, 4);
    map.mark([...some, "no such node"]);
    if (map.marked.join() !== map._ordered().filter(x => some.includes(x)).join()) res.behaviour.push(`marked ${map.marked.join(",")} for ${some.join(",")}`);
    const after = rects();
    for (const [k, v] of before) { const w = after.get(k); if (!w || Math.abs(w.l - v.l) > 0.5 || Math.abs(w.t - v.t) > 0.5) { res.behaviour.push(`mark() moved ${k}`); break; } }
    const b0 = map._els.get(some[0]), cs = getComputedStyle(b0);
    if (!(b0.getAttribute("part") ?? "").split(" ").includes("marked")) res.behaviour.push("a marked node has no part marked");
    if (!matchMedia("(forced-colors: active)").matches) {
      const dot = getComputedStyle(b0, "::after").backgroundColor, paper = getComputedStyle(boardEl).backgroundColor;
      if (ratio(dot, cs.backgroundColor) < 3 || ratio(dot, paper) < 3) res.behaviour.push(`the mark's dot has ${ratio(dot, cs.backgroundColor).toFixed(2)}:1 on its fill, ${ratio(dot, paper).toFixed(2)}:1 on paper`);
      if (ratio(getComputedStyle(b0.querySelector(".t") ?? b0).color, cs.backgroundColor) < 4.5) res.behaviour.push("a marked node's title is under 4.5:1 on its fill");
      const other = [...map._els.values()].find(b => !b.matches(".marked"));
      if (other && getComputedStyle(other).backgroundColor !== paper) res.behaviour.push("an unmarked node did not step back");
    }
    // nextMark: current mark in reading order, revealed, tab stop, said, selection untouched.
    const sel0 = map.selected;
    const first = map.nextMark(), second = map.nextMark();
    if (first !== map.marked[0] || second !== map.marked[1 % map.marked.length]) res.behaviour.push(`nextMark went ${first}, ${second}`);
    if (map.selected !== sel0) res.behaviour.push("nextMark changed the selection");
    if (map._els.get(second).tabIndex !== 0) res.behaviour.push("the current mark does not hold the tab stop");
    if (!(map._els.get(second).getAttribute("part") ?? "").includes("marked-current")) res.behaviour.push("the current mark has no part marked-current");
    await new Promise(r => setTimeout(r, 150));
    if (!map._status.textContent.includes(`2 of ${map.marked.length}`)) res.behaviour.push(`nextMark said "${map._status.textContent}"`);
    if (map.nextMark(-1) !== first) res.behaviour.push("nextMark(-1) did not go back");
    // Follow a rename, leave with a removed node, clear.
    map.renameNode(some[0], "audit_marked");
    if (!map.marked.includes("audit_marked")) res.behaviour.push("a mark did not follow a rename");
    map.undo();
    map.removeNode(some[1]);
    if (map.marked.includes(some[1])) res.behaviour.push("a removed node stayed marked");
    map.undo();
    map.mark(null);
    if (map.marked.length || map.root.querySelector(".marked") || boardEl.classList.contains("has-marks")) res.behaviour.push("mark(null) left marks");
    if (heard.length < 2 || heard.some(d => !Array.isArray(d.ids))) res.behaviour.push(`mark events: ${JSON.stringify(heard).slice(0, 120)}`);
    map.removeEventListener("mark", onMark);
  } catch (e) { res.behaviour.push(`marks check threw ${e.name}: ${e.message}`); }
  // Forced colours (Windows contrast themes; Chromium emulates them): the selection, an incoming
  // and an outgoing neighbour and the rest differ by more than colour.
  if (matchMedia("(forced-colors: active)").matches) {
    const hub = live.find(x => { const m = map.toJSON(); return m.edges.some(e => e.to === x && e.from !== x) && m.edges.some(e => e.from === x && e.to !== x); });
    if (hub) {
      map.select(hub, { focus: false, animate: false });
      const look = b => { const c = getComputedStyle(b, "::before"); return c.content === "none" || c.content === "normal" ? "none" : `${c.borderTopStyle} ${c.borderTopWidth}`; };

    document.body.append(raced);
    raced.setAttribute("src", "../../examples/incident-response/board.json?slow=1");
    raced.setAttribute("src", "../../examples/state-machine/board.json");
    await raced.ready;
    await new Promise(r => setTimeout(r, 600));
    window.fetch = realFetch;
    const shown = raced.atlas.toJSON().nodes.map(n => n.id);
    const want = (await (await fetch("../../examples/state-machine/board.json")).json()).nodes.map(n => n.id);
    if (shown.sort().join() !== want.sort().join()) res.behaviour.push("<atlas-map> shows an older src that answered later");
    raced.atlas.destroy();
    raced.remove();
    document.body.append(raced);
    await new Promise(r => setTimeout(r, 300));
    if (raced.atlas.destroyed || !raced.shadowRoot.querySelector(".node")) res.behaviour.push("a destroyed <atlas-map> stays empty when inserted again");
    raced.remove();
  } catch (e) { res.behaviour.push(`element check threw ${e.name}: ${e.message}`); }
  // Motion, on an animated map (deterministic: animations are paused and moved to a time).
  res.motion = [];
  try {
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const hostM = document.createElement("div"); document.querySelector("main").append(hostM);
    const fresh = (opts = {}) => { hostM.replaceChildren(); const h = document.createElement("div"); hostM.append(h); return new Atlas(h, { document: text, animate: true, ...opts }); };
    const anims = m => [...m._animations];
    const at = (m, ms) => { for (const a of anims(m)) { a.pause(); a.currentTime = ms; } };
    const box = (m, id) => { const r = m._els.get(id).getBoundingClientRect(); return { x: r.left, y: r.top }; };
    const frames = () => new Promise(r => setTimeout(r, 120));
    // An edit that moves every node: a new first lane (or, in automatic lanes, a new source in front).
    const shove = m => {
      if (m._layout.mode === "lanes") return m.addLane({ id: "m_lane", title: "Motion" }, { index: 0 });
      return m.addNode({ id: "m_new", title: "Motion" }, { edges: [{ from: "m_new", to: m._layout.order.get(m._layout.flow[0].id)[0] }] });
    };
    const rootAnims = m => m.root.getAnimations?.() ?? document.getAnimations();
    let m = fresh();
    await frames();
    if (!reduced) {
      // Reads come before writes: no layout read after the first animation started.
      const log = [], gb = Element.prototype.getBoundingClientRect, an = Element.prototype.animate;
      Element.prototype.getBoundingClientRect = function () { log.push("r"); return gb.call(this); };
      Element.prototype.animate = function (...x) { log.push("a"); return an.apply(this, x); };
      try { shove(m); } finally { Element.prototype.getBoundingClientRect = gb; Element.prototype.animate = an; }
      const late = log.slice(log.indexOf("a") + 1).filter(x => x === "r").length;
      if (log.includes("a") && late) res.motion.push(`an edit read the layout ${late} times after its first animation`);
      if (!anims(m).length) res.motion.push("an edit that moves nodes did not animate");
      // Interrupted halfway, the next edit starts every node from where it is seen.
      const mid = Math.max(...anims(m).map(a => (a.effect.getTiming().delay ?? 0) + 120));
      at(m, mid);
      const seen = new Map([...m._els].map(([id]) => [id, box(m, id)]));
      m.undo();
      let jump = 0;
      for (const [id, p] of seen) if (m._els.has(id)) { const q = box(m, id); jump = Math.max(jump, Math.hypot(q.x - p.x, q.y - p.y)); }
      if (jump > 1) res.motion.push(`an edit during a move made nodes jump ${jump.toFixed(1)}px`);
      m.settle();
      // A selection made while nodes move waits for them before its wires are measured.
      const someone = ids.find(x => model.edges.some(e => e.from === x || e.to === x));
      shove(m);
      let early = 0;
      const paint = m._paint.bind(m);
      m._paint = a => { if (anims(m).some(x => x.playState === "running" || x.playState === "pending")) early++; return paint(a); };
      m.select(someone, { focus: false });
      m._paint = paint;
      if (early) res.motion.push("a selection during a move drew wires on nodes in flight");
      m.settle(); m.undo(); m.settle();
      // A node selected with focus while it moves is scrolled into view where it lands.
      scrollTo(0, 0);
      shove(m);
      const target = m._layout.order.get(m._layout.flow.at(-1).id).at(-1);
      m.select(target);
      m.settle();
      const tr = m._els.get(target).getBoundingClientRect();
      if (tr.top < -1 || tr.bottom > innerHeight + 1) res.motion.push(`${target}, selected while moving, ended off screen (${Math.round(tr.top)}-${Math.round(tr.bottom)} of ${innerHeight})`);
      m.undo(); m.settle(); scrollTo(0, 0);
      // A removed node fades out as itself, where it was.
      const gone = ids.find(x => x !== someone);
      const was = m._els.get(gone).getBoundingClientRect(), title = m._els.get(gone).textContent;
      m.removeNode(gone);
      const ghost = [...m.root.querySelectorAll(".ghosts > .node, .board > .node[aria-hidden]")][0];
      if (!ghost) res.motion.push("a removed node left no ghost");
      else {
        const g = ghost.getBoundingClientRect();
        if (ghost.textContent !== title) res.motion.push(`the ghost of ${gone} reads "${ghost.textContent}"`);
        if (Math.abs(g.left - was.left) > 0.5 || Math.abs(g.top - was.top) > 0.5) res.motion.push(`the ghost of ${gone} is ${(g.left - was.left).toFixed(1)},${(g.top - was.top).toFixed(1)}px off`);
      }
      m.settle(); m.undo(); m.settle();
      // Lane titles travel with their nodes: at the start of a move a title keeps its distance to its node.
      const lanes = m.toJSON().lanes?.filter(l => (l.kind ?? "flow") === "flow") ?? [];
      if (lanes.length && res.mode === "flow" && m._layout.mode === "lanes") {
        const l0 = lanes[0].id, n0 = m._layout.order.get(l0)[0];
        const tEl = () => m.root.querySelector(`.lane[data-lane="${CSS.escape(l0)}"] .lane-title`);
        const gap = () => { const a = tEl().getBoundingClientRect(), b = m._els.get(n0).getBoundingClientRect(); return [b.left - a.left, b.top - a.top]; };
        const g0 = gap();
        m.addLane({ id: "m_lane", title: "Motion" }, { index: 0 });
        at(m, 0);
        const g1 = gap();
        if (Math.hypot(g1[0] - g0[0], g1[1] - g0[1]) > 1) res.motion.push(`a lane title left its node at the start of a move (${(g1[0] - g0[0]).toFixed(0)},${(g1[1] - g0[1]).toFixed(0)}px)`);
        m.settle(); m.undo(); m.settle();
      }
      // Wires: an edit that changes none of the selection's wires leaves them alone; one that moves
      // them reshapes them with the nodes where the browser can animate a path.
      if (res.mode === "flow") {
        m.select(someone, { focus: false, animate: false });
        const before = [...m.root.querySelectorAll(".wire")];
        const other = ids.find(x => x !== someone && !model.edges.some(e => (e.from === x && e.to === someone) || (e.to === x && e.from === someone)));
        m.updateNode(other, { details: ["motion audit"] });
        m.settle();
        const after = [...m.root.querySelectorAll(".wire")];
        if (before.length !== after.length || before.some((w, i) => w !== after[i])) res.motion.push("an edit that changed no wire drew the wires again");
        m.undo(); m.settle();
        const mover = someone;
        if (CSS.supports("d", 'path("M0 0")')) {
          // Every node moves: the selected node's wires that keep their shape must reshape.
          const { sameShape } = await import("../../src/motion.js");
          m.select(mover, { focus: false, animate: false });
          const key = w => `${w.k}:${w.from}>${w.to}`;
          const was = new Map(m._wires.map(w => [key(w), w.screen]));
          shove(m);
          const reshaped = anims(m).filter(a => a.effect.target?.classList?.contains("wire")).length;
          m.settle();
          const should = m._wires.filter(w => was.has(key(w)) && sameShape(was.get(key(w)), w.screen) && JSON.stringify(was.get(key(w))) !== JSON.stringify(w.screen));
          if (should.length && !reshaped) res.motion.push(`${should.length} wires of ${mover} kept their shape but did not reshape with it`);
          // A reshaped wire is drawn whole: the dashes of its first trace were cut to its old length.
          for (const w of m.root.querySelectorAll(".wire")) {
            const dash = getComputedStyle(w).strokeDasharray;
            const first = parseFloat(dash);
            if (dash !== "none" && !w.classList.contains("backward") && first + 1 < w.getTotalLength()) { res.motion.push(`a reshaped wire shows ${first.toFixed(0)} of its ${w.getTotalLength().toFixed(0)}px`); break; }
          }
          m.undo(); m.settle();
        }
      }
    } else {
      shove(m);
      const travel = anims(m).filter(a => a.effect.getKeyframes().some(k => k.transform && k.transform !== "none"));
      if (travel.length) res.motion.push(`under reduced motion an edit moved ${travel.length} things`);
      m.settle(); m.undo(); m.settle();
    }
    // The detail panel opening below the board does not cut the wires being traced, and a map built
    // with a selection traces it.
    if (res.mode === "flow" && !reduced) {
      const someone = ids.find(x => model.edges.some(e => e.from === x || e.to === x));
      m = fresh({ selected: someone });
      await frames();
      if (!m.root.querySelector(".wire.draw")) res.motion.push("the selection a map starts with was never traced");
      m.select(null, { focus: false });
      await frames();
      for (const id of ids.filter(x => model.edges.some(e => e.from === x || e.to === x)).slice(0, 6)) {
        m.select(id, { focus: false });
        await frames();
        if (!m.root.querySelector(".wire.draw")) { res.motion.push(`selecting ${id} (panel ${m._wrap.dataset.panel}): its wires stopped tracing`); break; }
      }
    }
    // The rows follow a change of the board's width (WebKit kept them at their old heights, and
    // nodes spilled into the next row).
    if (res.mode === "flow") {
      m = fresh();
      await frames();
      hostM.style.width = `${Math.round(hostM.getBoundingClientRect().width * 0.8)}px`;
      await frames();
      // What the resize observer does on the next frame (headless Chrome may produce no frame).
      m._applyMode(); m._refreshRows?.(); m._placePanel();
      const live = m._board.getBoundingClientRect().height;
      m.load(text);
      const built = m._board.getBoundingClientRect().height;
      hostM.style.width = "";
      if (Math.abs(live - built) > 1) res.motion.push(`after the board got narrower its rows were ${(live - built).toFixed(1)}px off`);
    }
    // Selecting starts few transitions, not one per node.
    m.select(ids[1] ?? ids[0], { focus: false });
    const css = rootAnims(m).filter(a => a instanceof CSSTransition).length;
    if (css > 3) res.motion.push(`a selection started ${css} CSS transitions`);
    // animate: false means no motion at all.
    m = fresh({ animate: false });
    shove(m);
    if (anims(m).length || rootAnims(m).some(a => !(a instanceof CSSTransition))) res.motion.push("animate: false still animated an edit");
    // A destroyed map changes nothing and says nothing.
    m = fresh();
    let heard = 0;
    m.addEventListener("change", () => heard++); m.addEventListener("select", () => heard++);
    shove(m);
    heard = 0;
    m.destroy();
    m.undo(); m.addNode({ id: "m_after" }); m.select(ids[0]); m.load(text);
    if (heard) res.motion.push(`a destroyed map fired ${heard} events`);
    hostM.remove();
  } catch (e) { res.motion.push(`motion check threw ${e.name}: ${e.message}`); }
  out(res);
} catch (e) {
  out({ error: String(e && e.stack || e) });
}
</script>
</body></html>
